<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Digital Receipt System</title>
  <link rel="stylesheet" href="styles.css" />
  <!-- DOMPurify CDN for input sanitization -->
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.6/dist/purify.min.js"></script>
</head>
<body>
  <div class="container">
    <h1>Digital Receipt System</h1>

    <form id="receiptForm" novalidate>
      <div class="form-group">
        <label for="salesData">Sales Data</label>
        <input type="text" id="salesData" name="salesData" placeholder="Enter sales data" required />
      </div>

      <div class="form-group">
        <label for="receiptNumber">Receipt Number</label>
        <input type="text" id="receiptNumber" name="receiptNumber" placeholder="Enter receipt number" required />
      </div>

      <div class="form-group">
        <label for="description">Description</label>
        <textarea id="description" name="description" rows="4" placeholder="Enter description" required></textarea>
      </div>

      <div class="form-group">
        <label for="paymentMethod">Payment Method</label>
        <select id="paymentMethod" name="paymentMethod" required>
          <option value="">Select...</option>
          <option value="Cash">Cash</option>
          <option value="Card">Card</option>
          <option value="Online Payment">Online Payment</option>
        </select>
      </div>

      <button type="submit">Generate Receipt</button>
    </form>

    <section id="receiptDisplay" class="receipt-display"></section>
  </div>

  <script src="script.js"></script>
</body>
</html>
